<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Deck</h2>
<div id="deck" class="deck"></div>

<h2>Hearts</h2>
<div id="hearts" class="row"></div>

<h2>Spades</h2>
<div id="spades" class="row"></div>

<div class="controls">

  <div>
    <label>Hearts Theme</label><br>
    <select id="heartsTheme"></select>
  </div>

  <div>
    <label>Spades Theme</label><br>
    <select id="spadesTheme"></select>
  </div>

  <button onclick="shuffleDeck()">Shuffle</button>
  <button onclick="pickCard()">Pick Card</button>
  <button onclick="resetDeck()">Reset</button>

</div>

<script src="script.js"></script>
</body>
</html>
