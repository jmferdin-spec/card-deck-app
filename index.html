<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Deck App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Card Deck</h1>

<div class="controls">
  <select id="heartsTheme"></select>
  <select id="spadesTheme"></select>

  <button id="shuffleBtn">Shuffle</button>
  <button id="pickBtn">Pick Card</button>
  <button id="resetBtn">Reset</button>
</div>

<div class="board">
  <div class="row" id="heartsRow"></div>
  <div class="row" id="spadesRow"></div>
</div>

<script src="script.js"></script>
</body>
</html>
