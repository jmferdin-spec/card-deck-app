<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Force revalidation so updates show up without manual cache-busting -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>LDO Sports & Pools — Card Deck</title>

  <!-- Auto cache-busting: appends ?v=<lastmod> to CSS so updates show up immediately. -->
  <script>
    (async function autoBust() {
      try {
        const r = await fetch('style.css', { method: 'HEAD', cache: 'no-store' });
        const v = r.headers.get('last-modified') || Date.now();
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'style.css?v=' + encodeURIComponent(v);
        document.head.appendChild(link);
      } catch (e) {
        // Fallback: load without busting
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'style.css';
        document.head.appendChild(link);
      }
    })();
  </script>
</head>
<body>

  <!-- FULLSCREEN TOGGLE (top-right) -->
  <button id="fsToggle" class="fs-toggle" onclick="toggleFullscreen()" aria-label="Toggle fullscreen" title="Toggle fullscreen"
          style="position:fixed; top:12px; right:12px; z-index:60;">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path class="fs-icon-enter" d="M4 9V4h5 M15 4h5v5 M20 15v5h-5 M9 20H4v-5"/>
      <path class="fs-icon-exit" d="M9 4v5H4 M20 9h-5V4 M4 15h5v5 M15 20v-5h5"/>
    </svg>
  </button>

  <main class="page">

    <section class="suit-section section-hearts">
      <h2 class="section-title" id="heartsLabel">Hearts</h2>
      <div id="hearts" class="row"></div>
    </section>

    <section class="suit-section section-spades">
      <h2 class="section-title" id="spadesLabel">Spades</h2>
      <div id="spades" class="row"></div>
    </section>

  </main>

  <!-- ACTION BAR: controls on the left, deck on the right -->
  <div class="action-bar">
    <div class="controls">
      <button class="btn btn-primary" onclick="shuffleDeck()">Shuffle</button>
      <button class="btn" onclick="resetDeck()">Reset</button>
      <button class="btn" onclick="openOptions()">Options</button>
    </div>

    <div class="deck-wrap">
      <p class="hint">Tap<br>to<br>draw</p>
      <div id="deck" class="deck" aria-label="Tap to draw a card"></div>
    </div>
  </div>

  <!-- OPTIONS MODAL -->
  <div id="optionsModal" class="modal hidden" onclick="modalBackdropClick(event)">
    <div class="modal-content">
      <h3>Options</h3>

      <div class="field">
        <label for="heartsTheme">Hearts Theme</label>
        <select id="heartsTheme"></select>
      </div>

      <div class="field">
        <label for="spadesTheme">Spades Theme</label>
        <select id="spadesTheme"></select>
      </div>

      <div class="field">
        <label>Top Row</label>
        <div class="suit-toggle" role="radiogroup" aria-label="Top suit">
          <button type="button" class="suit-toggle-btn" data-suit="hearts" onclick="setTopSuitChoice('hearts')">Hearts</button>
          <button type="button" class="suit-toggle-btn" data-suit="spades" onclick="setTopSuitChoice('spades')">Spades</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn" onclick="closeOptions()">Cancel</button>
        <button class="btn btn-primary" onclick="applyThemes()">Apply</button>
      </div>
    </div>
  </div>

  <script>
    (async function autoBustJS() {
      try {
        const r = await fetch('script.js', { method: 'HEAD', cache: 'no-store' });
        const v = r.headers.get('last-modified') || Date.now();
        const s = document.createElement('script');
        s.src = 'script.js?v=' + encodeURIComponent(v);
        document.body.appendChild(s);
      } catch (e) {
        const s = document.createElement('script');
        s.src = 'script.js';
        document.body.appendChild(s);
      }
    })();
  </script>
</body>
</html>
